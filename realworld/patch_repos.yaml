# Real Spectre-v1 fixes (pre-patch = vulnerable, post-patch = mitigated).
# Kernel/Xen builds run in the native specexec-toolchain image as CROSS builds (ruling R7).
# Clones/worktrees live under $HOME (Colima only mounts $HOME, ruling R8).
# {target} in asm_cmd = <cfile minus .c, relative to make_dir>.s
linux:
  url_template: "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id={sha}"
  licence: GPL-2.0-only
  arch: x86_64
  compiler: gcc
  opt: "-O2"
  terms: [array_index_nospec, barrier_nospec, array_index_mask_nospec]
  default_label: SPECTRE_V1
  make_dir: ""
  # old kernels' host tools (objtool, ...) fail on trixie's gcc 14 under -Werror: shim host gcc
  env_prefix: >-
    mkdir -p /tmp/shim &&
    printf '#!/bin/sh\nexec /usr/bin/gcc "$@" -Wno-error -Wno-redundant-decls\n' > /tmp/shim/gcc &&
    chmod +x /tmp/shim/gcc && export PATH=/tmp/shim:$PATH
  ready_marker: include/config/auto.conf
  # SECURITY_SELINUX off: pre-4.20 genheaders aborts on modern glibc's AF_MAX
  # regen_cmd runs before EVERY build: .config = x86_64_defconfig + fixed fragment (no order dependence)
  regen_cmd: >-
    make ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- x86_64_defconfig &&
    scripts/config --disable SECURITY_SELINUX &&
    make ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- olddefconfig
  # generated config state layout differs between kernel versions: wiped when the version header changes
  wipe_cmd: "rm -rf include/config include/generated"
  prepare_cmd: "make ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- prepare"
  # KCFLAGS: kernel builds with -fno-asynchronous-unwind-tables, so no .cfi_startproc for asm.extract_named_functions
  build_flags: "ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- KCFLAGS=-fasynchronous-unwind-tables"
  asm_cmd: "make {build_flags} {target}"
  # CVE -> class when it is not plain Spectre-v1 bounds-check bypass
  cve_labels: {}
# The same fix commits built for arm64. The toolchain image is native arm64.
# Own worktree: generated config state of one arch must not leak into the other's build.
linux_arm64:
  url_template: "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id={sha}"
  licence: GPL-2.0-only
  arch: arm64
  compiler: gcc
  opt: "-O2"
  terms: [array_index_nospec, barrier_nospec, array_index_mask_nospec]
  default_label: SPECTRE_V1
  make_dir: ""
  worktree: linux_arm64
  # CROSS_COMPILE names the native compiler by triplet so the host-gcc shim below never touches
  # target code (as in the x86 build). HOSTCFLAGS=-fcommon: old kernels' dtc defines yylloc twice,
  # which gcc >= 10 rejects at link time; arm64 builds dtc, x86 does not.
  env_prefix: >-
    mkdir -p /tmp/shim &&
    printf '#!/bin/sh\nexec /usr/bin/gcc "$@" -Wno-error -Wno-redundant-decls\n' > /tmp/shim/gcc &&
    chmod +x /tmp/shim/gcc && export PATH=/tmp/shim:$PATH
  ready_marker: include/config/auto.conf
  regen_cmd: >-
    make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon defconfig &&
    scripts/config --disable SECURITY_SELINUX &&
    make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon olddefconfig
  wipe_cmd: "rm -rf include/config include/generated"
  prepare_cmd: "make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon prepare"
  build_flags: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon KCFLAGS=-fasynchronous-unwind-tables"
  asm_cmd: "make {build_flags} {target}"
  cve_labels: {}
xen:
  url_template: "https://xenbits.xen.org/gitweb/?p=xen.git;a=commit;h={sha}"
  licence: GPL-2.0-only
  arch: x86_64
  compiler: gcc
  opt: "-O2"
  terms: [array_index_nospec, barrier_nospec, array_index_mask_nospec, block_speculation, evaluate_nospec]
  default_label: SPECTRE_V1
  make_dir: xen
  regen_cmd: "make -C xen XEN_TARGET_ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu- defconfig"
  build_flags: "XEN_TARGET_ARCH=x86_64 CROSS_COMPILE=x86_64-linux-gnu-"
  asm_cmd: "make -C xen {build_flags} {target}"
  cve_labels: {}
